<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}inkprint{% endblock %}</title>
    <style>
      :root {
        --fg: #222;
        --muted: #888;
        --border: #e5e5e5;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
        color: var(--fg);
        line-height: 1.6;
      }
      header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
      header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
      header h1 a { color: var(--fg); text-decoration: none; }
      header .nav { margin-top: 0.5rem; font-size: 0.9rem; }
      header .nav a { color: var(--accent); text-decoration: none; margin-right: 1rem; }
      h2 { font-weight: 600; margin-top: 2rem; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .empty { color: var(--muted); padding: 2rem; text-align: center; border: 1px dashed var(--border); border-radius: 6px; }
      ul.cards { list-style: none; padding: 0; }
      ul.cards li {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1rem;
        margin-bottom: 0.75rem;
      }
      ul.cards li a { color: var(--fg); text-decoration: none; font-weight: 500; }
      form { margin: 1rem 0; }
      form label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; color: var(--muted); }
      form input[type=text], form textarea, form select {
        width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; font: inherit;
      }
      form button {
        margin-top: 1rem; padding: 0.5rem 1.2rem; border: 0; border-radius: 4px;
        background: var(--accent); color: white; font: inherit; cursor: pointer;
      }
      table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
      table th, table td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
      table th { color: var(--muted); font-weight: 500; }
      .flash {
        background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
        padding: 0.6rem 0.9rem; border-radius: 6px; margin-bottom: 1.5rem;
        font-size: 0.92rem;
      }
      article.sample-body {
        margin-top: 1.5rem; padding: 1.2rem; border: 1px solid var(--border);
        border-radius: 6px; background: #fafafa;
        white-space: pre-wrap; word-wrap: break-word;
        line-height: 1.75;
      }
      pre.profile {
        background: #f8fafc; border: 1px solid var(--border); border-radius: 6px;
        padding: 1rem; font-size: 0.85rem; line-height: 1.55;
        white-space: pre-wrap; word-wrap: break-word; overflow-x: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .busy-overlay {
        position: fixed; inset: 0;
        background: rgba(255, 255, 255, 0.88);
        display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 1rem;
        z-index: 9999;
        font-size: 0.95rem; color: var(--fg);
        backdrop-filter: blur(2px);
      }
      .busy-overlay.show { display: flex; }
      .busy-spinner {
        width: 36px; height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: busy-spin 0.8s linear infinite;
      }
      @keyframes busy-spin { to { transform: rotate(360deg); } }
      form button[disabled] { opacity: 0.6; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="/">inkprint</a></h1>
      <div class="nav">
        <a href="/">人格列表</a>
        <a href="/personas/new">新建人格</a>
      </div>
    </header>
    {% block content %}{% endblock %}
    <div class="busy-overlay" id="busy-overlay" aria-live="polite" aria-hidden="true">
      <div class="busy-spinner" aria-hidden="true"></div>
      <div id="busy-message">处理中…</div>
    </div>
    <script>
      (function () {
        var overlay = document.getElementById('busy-overlay');
        var msg = document.getElementById('busy-message');
        function show(text) {
          msg.textContent = text;
          overlay.classList.add('show');
          overlay.setAttribute('aria-hidden', 'false');
        }
        function hide() {
          overlay.classList.remove('show');
          overlay.setAttribute('aria-hidden', 'true');
          document.querySelectorAll('form button[disabled]').forEach(function (b) {
            b.disabled = false;
          });
        }
        document.addEventListener('submit', function (e) {
          // inline onsubmit="return confirm(...)" 在 cancel 时会调用 preventDefault，
          // 这种情况下表单不会真提交，遮罩也不该亮。
          if (e.defaultPrevented) return;
          var form = e.target;
          if (!(form instanceof HTMLFormElement)) return;
          var text = form.dataset.busy || '处理中，请稍候…';
          show(text);
          form.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        });
        // bfcache: 后退回到本页时遮罩还可能挂着，清掉
        window.addEventListener('pageshow', function (e) {
          if (e.persisted) hide();
        });
      })();
    </script>
  </body>
</html>
