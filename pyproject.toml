[project]
name = "inkprint"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "json5>=0.14.0",
    "openai>=2.37.0",
    "playwright>=1.59.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.29",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
# crawlers/ 是 setup.py 克隆的第三方代码（gitignored），其自带的旧测试不进本套件；
# testpaths + norecursedirs 双保险：本地裸跑 pytest 也不会收集到它们。
testpaths = ["tests"]
norecursedirs = ["crawlers", ".venv", "data", "samples", "profiles", "setup.py"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
extend-exclude = ["crawlers"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
