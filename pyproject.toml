[project]
name = "inkprint"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "json5>=0.14.0",
    "openai>=2.37.0",
    "playwright>=1.59.0",
    "python-multipart>=0.0.29",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
extend-exclude = ["crawlers"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
